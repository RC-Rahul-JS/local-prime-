[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-prime"
version = "1.0.0"
description = "Enterprise Loan Management System & GST Invoice Generator"
authors = [
    { name = "Rahul", email = "rahul@localprime.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "pymongo>=4.6.0",
    "reportlab>=4.0.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "dnspython>=2.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
